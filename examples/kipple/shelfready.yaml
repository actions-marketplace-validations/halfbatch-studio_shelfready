privacyNotes:
- heading: Your tasks
  body: '- Your tasks are saved in a plain-text file (`plan.txt`) on your iPhone.

    - If you use iCloud Drive, the file is also saved to **your own** iCloud Drive and synced by
    Apple between your devices. Apple''s privacy policy covers this; the developer can''t see your
    iCloud Drive.

    - If you choose your own sync file, kipple reads and writes only that file.

    - The kipple widget and the "Add to kipple" share extension read and write the same file, on
    your device.

    - Your tasks stay in your own file; deleting the app or the file removes them.

    - Anonymous crash reports that Apple may share contain no task contents.'
- heading: Notifications
  body: Reminders and the morning summary are **local notifications**. They're scheduled on your
    iPhone from your own tasks and are never sent to a server.
- heading: Siri and Shortcuts
  body: When you use kipple with Siri or Shortcuts, the request is handled by Apple's systems under
    Apple's privacy policy. kipple only reads or adds tasks in your file on the device.
support:
  replyTime: within a few days
  faq:
  - q: What is kipple?
    a: Open tasks left on past days, plus tasks you've postponed twice or more in two weeks. The counter
      shows how much has piled up. Finish, move or cancel them to clear it.
  - q: Where are my tasks stored?
    a: In one plain-text file, `plan.txt`. With iCloud Drive on, it's in kipple's folder in your iCloud
      Drive and syncs between your devices. You can open and edit it in any text editor.
  - q: How do I add a reminder?
    a: "Long-press a task › Remind at…, or type a time in the task: `Call the dentist @14:30`."
  - q: How do repeating tasks work?
    a: "Long-press a task › Repeat, or type a rule at the end: `(every day)`, `(every weekday)`, `(every
      3 days)`, `(every mon, thu)`, `(every month)`. When you finish one, the next one appears on
      its next date. A missed repeat is marked skipped, so it doesn't pile up as kipple."
  - q: My widget doesn't update.
    a: Open kipple once; widgets refresh when the plan changes. If you ticked tasks off in the widget,
      the app picks those changes up when it opens.
  - q: How do I delete my data?
    a: Delete the app, and delete `plan.txt` from iCloud Drive if you used sync. kipple keeps no data
      anywhere else.
  - q: Does kipple work on iPad or Mac?
    a: Not yet. kipple 1.0 is for iPhone.
