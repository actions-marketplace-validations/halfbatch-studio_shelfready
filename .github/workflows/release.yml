name: Release
# Push a tag like v0.2.0 (matching cli/package.json) to publish to npm, create the GitHub release,
# move the major tag (v0) and update the Homebrew tap. See RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # GitHub release and moving the major tag
  id-token: write   # npm trusted publishing (no npm token stored in GitHub)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Check the tag matches the package version
        working-directory: cli
        run: |
          tag="${GITHUB_REF_NAME#v}"; pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then echo "::error::Tag $GITHUB_REF_NAME doesn't match cli/package.json version $pkg"; exit 1; fi
          plugin=$(node -p "require('../plugin/.claude-plugin/plugin.json').version"); pin=$(node -p "require('../plugin/.mcp.json').mcpServers.shelfready.args.find(a => a.startsWith('shelfready@')).split('@')[1]")
          if [ "$plugin" != "$pkg" ] || [ "$pin" != "$pkg" ]; then echo "::error::plugin.json ($plugin) and plugin/.mcp.json (shelfready@$pin) must match cli/package.json ($pkg)"; exit 1; fi
          server=$(node -p "require('../server.json').version")
          if [ "$server" != "$pkg" ]; then echo "::error::server.json version ($server) must match cli/package.json ($pkg)"; exit 1; fi

      - name: Test and build
        working-directory: cli
        run: npm ci && npm run typecheck && npm test && npm run build && npm run pack:check

      - name: Publish to npm
        working-directory: cli
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "shelfready@$v" version >/dev/null 2>&1; then echo "shelfready@$v is already on npm"; else npm publish --access public; fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && echo "Release $GITHUB_REF_NAME exists" \
            || gh release create "$GITHUB_REF_NAME" --title "ShelfReady $v" --notes-file /tmp/notes.md

      - name: Move the major tag (v0) so `@v0` gets this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" && git push -f origin "refs/tags/$major"

      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          url="https://registry.npmjs.org/shelfready/-/shelfready-$v.tgz"
          # npm can take several minutes to serve a new tarball ("Your package is being processed").
          for i in $(seq 1 60); do curl -fsSL "$url" -o /tmp/pkg.tgz 2>/dev/null && break; rm -f /tmp/pkg.tgz; sleep 20; done
          if [ ! -s /tmp/pkg.tgz ]; then echo "::error::$url still not served after 20 minutes; re-run this job later."; exit 1; fi
          sha=$(sha256sum /tmp/pkg.tgz | cut -d' ' -f1)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256: '$sha'"; exit 1; }
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/halfbatch-studio/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          sed -e "s/{{VERSION}}/$v/g" -e "s/{{SHA256}}/$sha/g" packaging/homebrew/shelfready.rb.tmpl > /tmp/tap/Formula/shelfready.rb
          cd /tmp/tap
          git add Formula/shelfready.rb
          if git diff --cached --quiet; then echo "Formula already at $v"; exit 0; fi
          git -c user.name="Half Batch" -c user.email="hello@shelfready.dev" commit -qm "shelfready $v"
          git push -q origin HEAD

      - name: Install cosign (verifies mcp-publisher)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true

      - name: Publish to the MCP Registry
        # Lists the server at registry.modelcontextprotocol.io, which MCP clients and directories read.
        # GitHub OIDC proves we own io.github.halfbatch-studio/*; no secret needed.
        # The registry is in preview, so a failure here doesn't fail the release.
        continue-on-error: true
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do [ "$(npm view "shelfready@$v" mcpName 2>/dev/null)" = "io.github.halfbatch-studio/shelfready" ] && break; sleep 20; done
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
